<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced gradients -->
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="convGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="residualGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E65100;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6A1B9A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F44336;stop-opacity:1" />
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#00000030"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1600" height="1000" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="800" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a1a">
    ResNet-50 Fast R-CNN Architecture
  </text>
  
  <!-- Input -->
  <g transform="translate(80, 80)">
    <rect width="120" height="80" rx="12" fill="url(#inputGrad)" filter="url(#shadow)" stroke="#2E7D32" stroke-width="2"/>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Input</text>
    <text x="60" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">224×224×3</text>
  </g>
  
  <!-- Conv1 + Pool -->
  <g transform="translate(280, 80)">
    <rect width="140" height="80" rx="12" fill="url(#convGrad)" filter="url(#shadow)" stroke="#1565C0" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Conv1</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">7×7/2 + Pool</text>
    <text x="70" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">56×56×64</text>
  </g>
  
  <!-- Conv2_x -->
  <g transform="translate(500, 80)">
    <rect width="140" height="80" rx="12" fill="url(#residualGrad)" filter="url(#shadow)" stroke="#E65100" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Conv2_x</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">3 Blocks</text>
    <text x="70" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">56×56×256</text>
    <!-- Skip connection indicator -->
    <path d="M 0 40 Q -20 40 -20 10 Q -20 -20 0 -20 L 140 -20 Q 160 -20 160 10 Q 160 40 140 40" 
          stroke="#E65100" stroke-width="2" fill="none" stroke-dasharray="5,5" opacity="0.7"/>
  </g>
  
  <!-- Conv3_x -->
  <g transform="translate(720, 80)">
    <rect width="140" height="80" rx="12" fill="url(#residualGrad)" filter="url(#shadow)" stroke="#E65100" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Conv3_x</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">4 Blocks</text>
    <text x="70" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">28×28×512</text>
    <!-- Skip connection indicator -->
    <path d="M 0 40 Q -20 40 -20 10 Q -20 -20 0 -20 L 140 -20 Q 160 -20 160 10 Q 160 40 140 40" 
          stroke="#E65100" stroke-width="2" fill="none" stroke-dasharray="5,5" opacity="0.7"/>
  </g>
  
  <!-- Conv4_x -->
  <g transform="translate(940, 80)">
    <rect width="140" height="80" rx="12" fill="url(#residualGrad)" filter="url(#shadow)" stroke="#E65100" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Conv4_x</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">6 Blocks</text>
    <text x="70" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">14×14×1024</text>
    <!-- Skip connection indicator -->
    <path d="M 0 40 Q -20 40 -20 10 Q -20 -20 0 -20 L 140 -20 Q 160 -20 160 10 Q 160 40 140 40" 
          stroke="#E65100" stroke-width="2" fill="none" stroke-dasharray="5,5" opacity="0.7"/>
  </g>
  
  <!-- Conv5_x -->
  <g transform="translate(1160, 80)">
    <rect width="140" height="80" rx="12" fill="url(#residualGrad)" filter="url(#shadow)" stroke="#E65100" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Conv5_x</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">3 Blocks</text>
    <text x="70" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">7×7×2048</text>
    <!-- Skip connection indicator -->
    <path d="M 0 40 Q -20 40 -20 10 Q -20 -20 0 -20 L 140 -20 Q 160 -20 160 10 Q 160 40 140 40" 
          stroke="#E65100" stroke-width="2" fill="none" stroke-dasharray="5,5" opacity="0.7"/>
  </g>
  
  <!-- Global Average Pooling -->
  <g transform="translate(1380, 80)">
    <rect width="120" height="80" rx="12" fill="url(#convGrad)" filter="url(#shadow)" stroke="#1565C0" stroke-width="2"/>
    <text x="60" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Global Avg</text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Pool</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">2048</text>
  </g>
  
  <!-- Arrows for main flow -->
  <g stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="220" y1="120" x2="260" y2="120"/>
    <line x1="440" y1="120" x2="480" y2="120"/>
    <line x1="660" y1="120" x2="700" y2="120"/>
    <line x1="880" y1="120" x2="920" y2="120"/>
    <line x1="1100" y1="120" x2="1140" y2="120"/>
    <line x1="1320" y1="120" x2="1360" y2="120"/>
  </g>
  
  <!-- Downward arrow to classification head -->
  <g stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="1440" y1="180" x2="1440" y2="220"/>
  </g>
  
  <!-- Classification Head -->
  <g transform="translate(1200, 240)">
    <!-- FC1 -->
    <rect width="160" height="60" rx="8" fill="url(#fcGrad)" filter="url(#shadow)" stroke="#6A1B9A" stroke-width="2"/>
    <text x="80" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Dense 2048→1024</text>
    <text x="80" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">BatchNorm + Dropout</text>
    <text x="80" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">2.10M params</text>
  </g>
  
  <g transform="translate(1200, 340)">
    <!-- FC2 -->
    <rect width="160" height="60" rx="8" fill="url(#fcGrad)" filter="url(#shadow)" stroke="#6A1B9A" stroke-width="2"/>
    <text x="80" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Dense 1024→512</text>
    <text x="80" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">BatchNorm + Dropout</text>
    <text x="80" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">525K params</text>
  </g>
  
  <g transform="translate(1200, 440)">
    <!-- FC3 -->
    <rect width="160" height="60" rx="8" fill="url(#fcGrad)" filter="url(#shadow)" stroke="#6A1B9A" stroke-width="2"/>
    <text x="80" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Dense 512→256</text>
    <text x="80" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">BatchNorm + Dropout</text>
    <text x="80" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">131K params</text>
  </g>
  
  <g transform="translate(1220, 540)">
    <!-- Output -->
    <rect width="120" height="60" rx="8" fill="url(#outputGrad)" filter="url(#shadow)" stroke="#C62828" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Output 256→90</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Reshape (10,9)</text>
    <text x="60" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">23K params</text>
  </g>
  
  <!-- Vertical arrows for classification head -->
  <g stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="1280" y1="320" x2="1280" y2="340"/>
    <line x1="1280" y1="420" x2="1280" y2="440"/>
    <line x1="1280" y1="520" x2="1280" y2="540"/>
  </g>
  
  <!-- ResNet Block Detail -->
  <g transform="translate(80, 250)">
    <rect width="400" height="180" rx="15" fill="#fff" stroke="#E65100" stroke-width="3" filter="url(#shadow)"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
      Residual Block Structure
    </text>
    
    <!-- Block diagram -->
    <g transform="translate(50, 40)">
      <!-- Input -->
      <rect x="0" y="60" width="60" height="30" rx="5" fill="#e0e0e0" stroke="#666"/>
      <text x="30" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Input</text>
      
      <!-- Conv layers -->
      <rect x="100" y="40" width="40" height="20" rx="3" fill="#1976D2" stroke="#0D47A1"/>
      <text x="120" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">1×1</text>
      
      <rect x="100" y="70" width="40" height="20" rx="3" fill="#1976D2" stroke="#0D47A1"/>
      <text x="120" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">3×3</text>
      
      <rect x="100" y="100" width="40" height="20" rx="3" fill="#1976D2" stroke="#0D47A1"/>
      <text x="120" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">1×1</text>
      
      <!-- Addition -->
      <circle cx="200" cy="75" r="15" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
      <text x="200" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">+</text>
      
      <!-- Output -->
      <rect x="250" y="60" width="60" height="30" rx="5" fill="#e0e0e0" stroke="#666"/>
      <text x="280" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Output</text>
      
      <!-- Arrows -->
      <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)">
        <line x1="70" y1="75" x2="90" y2="50"/>
        <line x1="150" y1="50" x2="150" y2="60"/>
        <line x1="150" y1="60" x2="150" y2="70"/>
        <line x1="150" y1="90" x2="150" y2="100"/>
        <line x1="150" y1="110" x2="175" y2="75"/>
        <line x1="225" y1="75" x2="240" y2="75"/>
      </g>
      
      <!-- Skip connection -->
      <path d="M 70 75 Q 70 130 200 130 Q 200 95 190 85" stroke="#E65100" stroke-width="3" fill="none" stroke-dasharray="8,4"/>
      <text x="135" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E65100" font-weight="bold">Skip Connection</text>
    </g>
  </g>
  
  <!-- Model Summary -->
  <g transform="translate(80, 480)">
    <rect width="900" height="180" rx="15" fill="#f8f9fa" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
    <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">
      Model Architecture Summary
    </text>
    
    <!-- Two columns of information -->
    <g transform="translate(40, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565C0">ResNet-50 Backbone:</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#333">• Deep residual network with skip connections</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="#333">• 50 layers total (Conv1 + 4 residual stages)</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333">• Progressive spatial downsampling (224→7)</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#333">• Channel expansion (3→64→256→512→1024→2048)</text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="12" fill="#333">• Bottleneck blocks: 1×1→3×3→1×1 convolutions</text>
      <text x="0" y="95" font-family="Arial, sans-serif" font-size="12" fill="#333">• Batch normalization after each convolution</text>
      <text x="0" y="110" font-family="Arial, sans-serif" font-size="12" fill="#333">• ~23M parameters (pre-trained weights)</text>
    </g>
    
    <g transform="translate(460, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">Detection Head:</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#333">• Global Average Pooling: 7×7×2048 → 2048</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="#333">• Three fully connected layers with dropout</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333">• Dimension reduction: 2048→1024→512→256</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#333">• Output layer: 256→90 (reshaped to 10×9)</text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="12" fill="#333">• Each detection: [x,y,w,h,conf] + class scores</text>
      <text x="0" y="95" font-family="Arial, sans-serif" font-size="12" fill="#333">• Supports 10 simultaneous object detections</text>
      <text x="0" y="110" font-family="Arial, sans-serif" font-size="12" fill="#333">• ~2.78M parameters (custom trained)</text>
    </g>
  </g>
  
  <!-- Performance Stats -->
  <g transform="translate(80, 700)">
    <rect width="900" height="120" rx="15" fill="#e8f5e8" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
    <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">
      Model Statistics
    </text>
    
    <g transform="translate(40, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">Parameters:</text>
      <text x="120" y="0" font-family="Arial, sans-serif" font-size="12" fill="#333">Total: 26.37M (100.6 MB)</text>
      <text x="120" y="15" font-family="Arial, sans-serif" font-size="12" fill="#333">Trainable: 22.23M (84.8 MB)</text>
      <text x="120" y="30" font-family="Arial, sans-serif" font-size="12" fill="#333">Frozen: 4.14M (15.8 MB)</text>
      
      <text x="320" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">Dataset:</text>
      <text x="400" y="0" font-family="Arial, sans-serif" font-size="12" fill="#333">Training: 2,100 samples</text>
      <text x="400" y="15" font-family="Arial, sans-serif" font-size="12" fill="#333">Validation: 400 samples</text>
      <text x="400" y="30" font-family="Arial, sans-serif" font-size="12" fill="#333">Input: 224×224×3 RGB</text>
      
      <text x="580" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">Output:</text>
      <text x="640" y="0" font-family="Arial, sans-serif" font-size="12" fill="#333">Shape: (batch, 10, 9)</text>
      <text x="640" y="15" font-family="Arial, sans-serif" font-size="12" fill="#333">10 object detections</text>
      <text x="640" y="30" font-family="Arial, sans-serif" font-size="12" fill="#333">9 features per object</text>
    </g>
  </g>
  
  <!-- Legend for skip connections -->
  <g transform="translate(520, 200)">
    <path d="M 0 0 L 30 0" stroke="#E65100" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="40" y="5" font-family="Arial, sans-serif" font-size="12" fill="#E65100" font-weight="bold">Residual Skip Connections</text>
  </g>
</svg>