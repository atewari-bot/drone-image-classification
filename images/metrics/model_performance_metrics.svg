  <text x="705" y="420" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">96.50%</text>
  
  <rect x="790" y="390" width="170" height="50" fill="white"/>
  <text x="875" y="420" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">95.25%</text>
  
