  <text x="365" y="720" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">0.9286</text>
  
  <rect x="450" y="690" width="170" height="50" fill="white"/>
  <text x="535" y="720" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">0.9024</text>
  
  <rect x="620" y="690" width="170" height="50" fill="white"/>
  <text x="705" y="720" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">0.7953</text>
  
  <rect x="790" y="690" width="170" height="50" fill="white"/>
  <text x="875" y="720" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">0.7120</text>
  
  <rect x="960" y="690" width="170" height="50" fill="white"/>
  <text x="1045" y="720" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">0.9565</text>
  
  <rect x="1130" y="690" width="170" height="50" fill="url(#bestValueBg)"/>
  <text x="1215" y="720" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">0.9960 🏆</text>
  
  <!-- Champions Section -->
