  <text x="535" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="600">Random Forest</text>
  
  <rect x="620" y="180" width="170" height="60" fill="url(#modelHeaderBg)"/>
  <text x="705" y="205" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="600">🧠 CNN</text>
  <text x="705" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="600">Classifier</text>
  
  <rect x="790" y="180" width="170" height="60" fill="url(#modelHeaderBg)"/>
  <text x="875" y="205" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="600">🔧 CNN</text>
  <text x="875" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="600">Denoised</text>
  
  <rect x="960" y="180" width="170" height="60" fill="url(#modelHeaderBg)"/>
  <text x="1045" y="205" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="600">🎯 CNN</text>
  <text x="1045" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="600">Detection</text>
  
  <rect x="1130" y="180" width="170" height="60" fill="url(#modelHeaderBg)"/>
  <text x="1215" y="205" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="600">⚡ Fast</text>
  <text x="1215" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="600">R-CNN</text>
  
  <!-- Training Performance Section -->
