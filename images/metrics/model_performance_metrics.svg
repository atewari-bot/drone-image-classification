  <rect x="280" y="390" width="170" height="50" fill="url(#bestValueBg)"/>
  <text x="365" y="420" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">98.25% 🏆</text>
  
  <rect x="450" y="390" width="170" height="50" fill="url(#secondBestBg)"/>
  <text x="535" y="420" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="600">97.75% 🥈</text>
  
