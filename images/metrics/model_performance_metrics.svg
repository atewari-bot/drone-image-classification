  <circle cx="150" cy="870" r="20" fill="url(#headerBg)"/>
  <text x="150" y="878" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">⚡</text>
  <text x="180" y="860" fill="#636e72" font-family="Arial, sans-serif" font-size="12">Fastest Training:</text>
  <text x="180" y="880" fill="#2d3436" font-family="Arial, sans-serif" font-size="16" font-weight="700">🌳 Random Forest (1.03s)</text>
  
  <rect x="420" y="840" width="280" height="60" rx="10" fill="white" filter="url(#shadow)"/>
  <circle cx="450" cy="870" r="20" fill="url(#headerBg)"/>
