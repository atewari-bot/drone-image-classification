  <text x="480" y="860" fill="#636e72" font-family="Arial, sans-serif" font-size="12">Highest Accuracy:</text>
  <text x="480" y="880" fill="#2d3436" font-family="Arial, sans-serif" font-size="16" font-weight="700">🌳 Random Forest (98.25%)</text>
  
  <rect x="720" y="840" width="280" height="60" rx="10" fill="white" filter="url(#shadow)"/>
  <circle cx="750" cy="870" r="20" fill="url(#headerBg)"/>
  <text x="750" y="878" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">📉</text>
  <text x="780" y="860" fill="#636e72" font-family="Arial, sans-serif" font-size="12">Lowest Error:</text>
  <text x="780" y="880" fill="#2d3436" font-family="Arial, sans-serif" font-size="16" font-weight="700">🎯 CNN Detection (0.0029)</text>
  
  <rect x="1020" y="840" width="280" height="60" rx="10" fill="white" filter="url(#shadow)"/>
  <circle cx="1050" cy="870" r="20" fill="url(#headerBg)"/>
  <text x="1050" y="878" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">📊</text>
  <text x="1080" y="860" fill="#636e72" font-family="Arial, sans-serif" font-size="12">Best Fit:</text>
  <text x="1080" y="880" fill="#2d3436" font-family="Arial, sans-serif" font-size="16" font-weight="700">⚡ Fast R-CNN (0.9960)</text>
  
  <!-- Key Insights Section -->
  <rect x="80" y="1060" width="1220" height="220" rx="15" fill="url(#insightsBg)"/>
  <text x="690" y="1095" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="700">💡 KEY INSIGHTS</text>
  
  <!-- Insight Cards -->
  <rect x="120" y="1120" width="550" height="80" rx="10" fill="rgba(255,255,255,0.15)"/>
  <text x="140" y="1145" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="600">✅ Production Ready:</text>
  <text x="140" y="1165" fill="white" font-family="Arial, sans-serif" font-size="13">Random Forest models excel in speed and accuracy balance,</text>
  <text x="140" y="1180" fill="white" font-family="Arial, sans-serif" font-size="13">making them ideal for production environments where both</text>
  <text x="140" y="1195" fill="white" font-family="Arial, sans-serif" font-size="13">performance and efficiency matter.</text>
  
  <rect x="690" y="1120" width="550" height="80" rx="10" fill="rgba(255,255,255,0.15)"/>
  <text x="710" y="1145" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="600">🎯 Specialized Tasks:</text>
  <text x="710" y="1165" fill="white" font-family="Arial, sans-serif" font-size="13">CNN models optimize for detection precision and coordinate</text>
  <text x="710" y="1180" fill="white" font-family="Arial, sans-serif" font-size="13">accuracy, with Fast R-CNN showing exceptional model fit</text>
  <text x="710" y="1195" fill="white" font-family="Arial, sans-serif" font-size="13">quality for complex detection tasks.</text>
  
  <!-- Footer Note -->
  <text x="690" y="1240" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-style="italic" opacity="0.9">* Detection models show coordinate accuracy and IoU metrics instead of classification precision</text>
  <text x="690" y="1260" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-style="italic" opacity="0.9">📊 Comprehensive analysis across 6 models with 21 performance metrics | Train/Validation/Test evaluation</text>
</svg>