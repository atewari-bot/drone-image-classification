  <text x="1045" y="520" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">0.0029 🏆</text>
  
  <rect x="1130" y="490" width="170" height="50" fill="url(#secondBestBg)"/>
  <text x="1215" y="520" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="600">0.0040 🥈</text>
  
