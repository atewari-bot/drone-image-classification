  <rect x="280" y="590" width="170" height="50" fill="url(#bestValueBg)"/>
  <text x="365" y="620" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">98.29% 🏆</text>
  
  <rect x="450" y="590" width="170" height="50" fill="url(#secondBestBg)"/>
  <text x="535" y="620" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="600">97.83% 🥈</text>
  
  <rect x="620" y="590" width="170" height="50" fill="white"/>
  <text x="705" y="620" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">96.54%</text>
  
  <rect x="790" y="590" width="170" height="50" fill="white"/>
  <text x="875" y="620" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">95.52%</text>
  
  <rect x="960" y="590" width="170" height="50" fill="white"/>
  <text x="1045" y="620" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">17.25% (IoU)</text>
  
