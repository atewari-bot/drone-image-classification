  <rect x="280" y="290" width="170" height="50" fill="url(#bestValueBg)"/>
  <text x="365" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">1.03 🏆</text>
  
  <rect x="450" y="290" width="170" height="50" fill="url(#secondBestBg)"/>
  <text x="535" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="600">1.21 🥈</text>
  
  <rect x="620" y="290" width="170" height="50" fill="white"/>
  <text x="705" y="320" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">246.60</text>
  
  <rect x="790" y="290" width="170" height="50" fill="white"/>
  <text x="875" y="320" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">214.17</text>
  
  <rect x="960" y="290" width="170" height="50" fill="white"/>
  <text x="1045" y="320" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">366.78</text>
  
  <rect x="1130" y="290" width="170" height="50" fill="white"/>
  <text x="1215" y="320" text-anchor="middle" fill="black" font-family="Arial, sans-serif" font-size="14">2802.62</text>
  
