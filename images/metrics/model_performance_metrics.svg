  <text x="700" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="600">📊 Comprehensive Model Performance Metrics</text>
  
  <!-- Model Headers -->
  <rect x="80" y="180" width="200" height="60" fill="url(#metricLabelBg)"/>
  <text x="180" y="220" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="700">Performance Metric</text>
  
  <rect x="280" y="180" width="170" height="60" fill="url(#modelHeaderBg)"/>
  <text x="365" y="205" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="600">🌳 Random Forest</text>
  <text x="365" y="225" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="600">Classifier</text>
  
  <rect x="450" y="180" width="170" height="60" fill="url(#modelHeaderBg)"/>
