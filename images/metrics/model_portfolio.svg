<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fb7185;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#1e293b"/>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" fill="white" font-size="24" font-weight="bold">
    🚀 Model Performance Comparison Dashboard
  </text>
  
  <!-- Model Headers -->
  <g id="headers">
    <rect x="50" y="60" width="180" height="40" fill="#334155" rx="8"/>
    <text x="140" y="85" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Performance Metric</text>
    
    <rect x="240" y="60" width="150" height="40" fill="url(#grad1)" rx="8"/>
    <text x="315" y="78" text-anchor="middle" fill="white" font-size="11" font-weight="bold">🌲 Random Forest</text>
    <text x="315" y="92" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Classifier</text>
    
    <rect x="400" y="60" width="150" height="40" fill="url(#grad2)" rx="8"/>
    <text x="475" y="78" text-anchor="middle" fill="white" font-size="11" font-weight="bold">⚡ Optimized</text>
    <text x="475" y="92" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Random Forest</text>
    
    <rect x="560" y="60" width="150" height="40" fill="url(#grad3)" rx="8"/>
    <text x="635" y="78" text-anchor="middle" fill="white" font-size="11" font-weight="bold">🧠 CNN</text>
    <text x="635" y="92" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Classification</text>
    
    <rect x="720" y="60" width="150" height="40" fill="url(#grad4)" rx="8"/>
    <text x="795" y="78" text-anchor="middle" fill="white" font-size="11" font-weight="bold">🧠 CNN Classification</text>
    <text x="795" y="92" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Denoised</text>
    
    <rect x="880" y="60" width="150" height="40" fill="url(#grad5)" rx="8"/>
    <text x="955" y="78" text-anchor="middle" fill="white" font-size="11" font-weight="bold">🎯 CNN Detection</text>
    <text x="955" y="92" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Model</text>
    
    <rect x="1040" y="60" width="150" height="40" fill="url(#grad6)" rx="8"/>
    <text x="1115" y="78" text-anchor="middle" fill="white" font-size="11" font-weight="bold">⚡ Fast R-CNN</text>
    <text x="1115" y="92" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Model</text>
  </g>
  
  <!-- Training Time Row -->
  <g id="training-time">
    <rect x="50" y="110" width="180" height="50" fill="#475569" rx="8"/>
    <text x="60" y="128" fill="white" font-size="12" font-weight="bold">⏱️ Training Time</text>
    <text x="60" y="145" fill="#94a3b8" font-size="11">(seconds)</text>
    
    <rect x="240" y="110" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="315" y="135" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">1.03s 🚀</text>
    
    <rect x="400" y="110" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="475" y="135" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">1.21s 🚀</text>
    
    <rect x="560" y="110" width="150" height="50" fill="#fef3c7" rx="8"/>
    <text x="635" y="135" text-anchor="middle" fill="#d97706" font-size="14" font-weight="bold">246.60s</text>
    
    <rect x="720" y="110" width="150" height="50" fill="#fef3c7" rx="8"/>
    <text x="795" y="135" text-anchor="middle" fill="#d97706" font-size="14" font-weight="bold">214.17s</text>
    
    <rect x="880" y="110" width="150" height="50" fill="#fecaca" rx="8"/>
    <text x="955" y="135" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">366.78s</text>
    
    <rect x="1040" y="110" width="150" height="50" fill="#fecaca" rx="8"/>
    <text x="1115" y="135" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">2802.62s</text>
  </g>
  
  <!-- Test Accuracy Row -->
  <g id="test-accuracy">
    <rect x="50" y="170" width="180" height="50" fill="#475569" rx="8"/>
    <text x="60" y="188" fill="white" font-size="12" font-weight="bold">🎯 Test Accuracy /</text>
    <text x="60" y="205" fill="#94a3b8" font-size="11">Coord Accuracy</text>
    
    <rect x="240" y="170" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="315" y="195" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">98.25% 🏆</text>
    
    <rect x="400" y="170" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="475" y="195" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">97.75% 🥈</text>
    
    <rect x="560" y="170" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="635" y="195" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">96.50%</text>
    
    <rect x="720" y="170" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="795" y="195" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">95.25%</text>
    
    <rect x="880" y="170" width="150" height="50" fill="#fef3c7" rx="8"/>
    <text x="955" y="195" text-anchor="middle" fill="#d97706" font-size="14" font-weight="bold">77.54%*</text>
    
    <rect x="1040" y="170" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="1115" y="195" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">90.48%*</text>
  </g>
  
  <!-- Test MSE Row -->
  <g id="test-mse">
    <rect x="50" y="230" width="180" height="50" fill="#475569" rx="8"/>
    <text x="60" y="248" fill="white" font-size="12" font-weight="bold">📊 Test MSE</text>
    <text x="60" y="265" fill="#94a3b8" font-size="11">(Lower is Better)</text>
    
    <rect x="240" y="230" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="315" y="255" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.075</text>
    
    <rect x="400" y="230" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="475" y="255" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.103</text>
    
    <rect x="560" y="230" width="150" height="50" fill="#fef3c7" rx="8"/>
    <text x="635" y="255" text-anchor="middle" fill="#d97706" font-size="14" font-weight="bold">0.215</text>
    
    <rect x="720" y="230" width="150" height="50" fill="#fecaca" rx="8"/>
    <text x="795" y="255" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">0.303</text>
    
    <rect x="880" y="230" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="955" y="255" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.003 🏆</text>
    
    <rect x="1040" y="230" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="1115" y="255" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.004 🥈</text>
  </g>
  
  <!-- Test MAE Row -->
  <g id="test-mae">
    <rect x="50" y="290" width="180" height="50" fill="#475569" rx="8"/>
    <text x="60" y="308" fill="white" font-size="12" font-weight="bold">📈 Test MAE</text>
    <text x="60" y="325" fill="#94a3b8" font-size="11">(Lower is Better)</text>
    
    <rect x="240" y="290" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="315" y="315" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.035</text>
    
    <rect x="400" y="290" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="475" y="315" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.035</text>
    
    <rect x="560" y="290" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="635" y="315" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.046</text>
    
    <rect x="720" y="290" width="150" height="50" fill="#fef3c7" rx="8"/>
    <text x="795" y="315" text-anchor="middle" fill="#d97706" font-size="14" font-weight="bold">0.057</text>
    
    <rect x="880" y="290" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="955" y="315" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.009 🏆</text>
    
    <rect x="1040" y="290" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="1115" y="315" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.048</text>
  </g>
  
  <!-- Test Precision/IoU Row -->
  <g id="test-precision">
    <rect x="50" y="350" width="180" height="50" fill="#475569" rx="8"/>
    <text x="60" y="368" fill="white" font-size="12" font-weight="bold">🎯 Test Precision /</text>
    <text x="60" y="385" fill="#94a3b8" font-size="11">IoU</text>
    
    <rect x="240" y="350" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="315" y="375" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">98.29% 🏆</text>
    
    <rect x="400" y="350" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="475" y="375" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">97.83% 🥈</text>
    
    <rect x="560" y="350" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="635" y="375" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">96.54%</text>
    
    <rect x="720" y="350" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="795" y="375" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">95.52%</text>
    
    <rect x="880" y="350" width="150" height="50" fill="#fecaca" rx="8"/>
    <text x="955" y="375" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">17.25%* (IoU)</text>
    
    <rect x="1040" y="350" width="150" height="50" fill="#fecaca" rx="8"/>
    <text x="1115" y="375" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="bold">23.93%* (IoU)</text>
  </g>
  
  <!-- Test R² Score Row -->
  <g id="test-r2">
    <rect x="50" y="410" width="180" height="50" fill="#475569" rx="8"/>
    <text x="60" y="428" fill="white" font-size="12" font-weight="bold">📊 Test R² Score</text>
    
    <rect x="240" y="410" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="315" y="435" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.929</text>
    
    <rect x="400" y="410" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="475" y="435" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.902</text>
    
    <rect x="560" y="410" width="150" height="50" fill="#fef3c7" rx="8"/>
    <text x="635" y="435" text-anchor="middle" fill="#d97706" font-size="14" font-weight="bold">0.795</text>
    
    <rect x="720" y="410" width="150" height="50" fill="#fef3c7" rx="8"/>
    <text x="795" y="435" text-anchor="middle" fill="#d97706" font-size="14" font-weight="bold">0.712</text>
    
    <rect x="880" y="410" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="955" y="435" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.957</text>
    
    <rect x="1040" y="410" width="150" height="50" fill="#dcfce7" rx="8"/>
    <text x="1115" y="435" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="bold">0.996 🏆</text>
  </g>
  
  <!-- Key Insights Section -->
  <g id="insights">
    <rect x="50" y="480" width="1140" height="180" fill="#0f172a" stroke="#334155" stroke-width="2" rx="12"/>
    <text x="70" y="510" fill="white" font-size="18" font-weight="bold">🎯 Key Performance Insights</text>
    
    <text x="70" y="540" fill="#10b981" font-size="14" font-weight="bold">⚡ Speed Champions:</text>
    <text x="70" y="560" fill="#d1d5db" font-size="12">Random Forest models dominate in training speed (1-1.2s) vs CNN models (200-400s) and R-CNN (2800s)</text>
    
    <text x="70" y="585" fill="#f59e0b" font-size="14" font-weight="bold">🎯 Accuracy Leaders:</text>
    <text x="70" y="605" fill="#d1d5db" font-size="12">Random Forest Classifier achieves highest test accuracy (98.25%) with exceptional precision (98.29%)</text>
    
    <text x="620" y="540" fill="#8b5cf6" font-size="14" font-weight="bold">📊 Regression Excellence:</text>
    <text x="620" y="560" fill="#d1d5db" font-size="12">Fast R-CNN leads in R² score (0.996) while CNN Detection excels in MSE/MAE metrics</text>
    
    <text x="620" y="585" fill="#ef4444" font-size="14" font-weight="bold">⚠️ Trade-offs:</text>
    <text x="620" y="605" fill="#d1d5db" font-size="12">Detection models sacrifice classification accuracy for specialized object detection capabilities</text>
    
    <text x="70" y="635" fill="#06b6d4" font-size="12" font-style="italic">* Detection models use different metrics (Coord_Acc, IoU) - direct comparison limited</text>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="680" width="1140" height="80" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/>
    <text x="70" y="705" fill="white" font-size="14" font-weight="bold">Legend:</text>
    
    <rect x="70" y="715" width="15" height="15" fill="#dcfce7" rx="2"/>
    <text x="95" y="727" fill="#d1d5db" font-size="11">Excellent Performance</text>
    
    <rect x="220" y="715" width="15" height="15" fill="#fef3c7" rx="2"/>
    <text x="245" y="727" fill="#d1d5db" font-size="11">Good Performance</text>
    
    <rect x="360" y="715" width="15" height="15" fill="#fecaca" rx="2"/>
    <text x="385" y="727" fill="#d1d5db" font-size="11">Needs Improvement</text>
    
    <text x="520" y="727" fill="#d1d5db" font-size="11">🏆 Best in Category</text>
    <text x="650" y="727" fill="#d1d5db" font-size="11">🥈 Second Best</text>
    <text x="780" y="727" fill="#d1d5db" font-size="11">🚀 Speed Optimized</text>
    
    <text x="70" y="750" fill="#94a3b8" font-size="10">Data source: Model performance comparison table | Created: July 2025</text>
  </g>
</svg>