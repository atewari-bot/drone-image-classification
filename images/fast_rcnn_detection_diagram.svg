<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">
  <!-- White background -->
  <rect width="100%" height="100%" fill="white"/>
  <defs>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="convGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6A1B9A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C62828;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    MobileNetV2 Detection Model Architecture
  </text>
  
  <!-- Input Layer -->
  <rect x="450" y="60" width="100" height="40" fill="url(#inputGrad)" rx="5"/>
  <text x="500" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Input</text>
  <text x="500" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">224×224×3</text>
  
  <!-- Initial Conv Layer -->
  <rect x="450" y="120" width="100" height="40" fill="url(#convGrad)" rx="5"/>
  <text x="500" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Conv1</text>
  <text x="500" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">112×112×24</text>
  
  <!-- Expanded Conv Block -->
  <rect x="450" y="180" width="100" height="40" fill="url(#blockGrad)" rx="5"/>
  <text x="500" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Expanded Conv</text>
  <text x="500" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">112×112×16</text>
  
  <!-- MobileNetV2 Blocks Section -->
  <rect x="100" y="240" width="800" height="280" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="5,5" rx="10"/>
  <text x="500" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    MobileNetV2 Inverted Residual Blocks
  </text>
  
  <!-- Block 1-3 (24 channels) -->
  <rect x="120" y="280" width="80" height="50" fill="url(#blockGrad)" rx="5"/>
  <text x="160" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Blocks 1-3</text>
  <text x="160" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">56×56×24</text>
  <text x="160" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">28×28×24</text>
  
  <!-- Block 4-6 (48 channels) -->
  <rect x="220" y="280" width="80" height="50" fill="url(#blockGrad)" rx="5"/>
  <text x="260" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Blocks 4-6</text>
  <text x="260" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">28×28×24</text>
  <text x="260" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">14×14×48</text>
  
  <!-- Block 7-10 (48-72 channels) -->
  <rect x="320" y="280" width="80" height="50" fill="url(#blockGrad)" rx="5"/>
  <text x="360" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Blocks 7-10</text>
  <text x="360" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">14×14×48</text>
  <text x="360" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">14×14×72</text>
  
  <!-- Block 11-13 (72-120 channels) -->
  <rect x="420" y="280" width="80" height="50" fill="url(#blockGrad)" rx="5"/>
  <text x="460" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Blocks 11-13</text>
  <text x="460" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">14×14×72</text>
  <text x="460" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">7×7×120</text>
  
  <!-- Block 14-16 (120-240 channels) -->
  <rect x="520" y="280" width="80" height="50" fill="url(#blockGrad)" rx="5"/>
  <text x="560" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Blocks 14-16</text>
  <text x="560" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">7×7×120</text>
  <text x="560" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">7×7×240</text>
  
  <!-- Feature Maps Info -->
  <rect x="120" y="350" width="480" height="40" fill="#f5f5f5" stroke="#ccc" rx="5"/>
  <text x="360" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">
    Inverted Residual Blocks with Depthwise Separable Convolutions
  </text>
  <text x="360" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Expand → Depthwise → Project with Residual Connections
  </text>
  
  <!-- Top Conv Layer -->
  <rect x="620" y="280" width="80" height="50" fill="url(#convGrad)" rx="5"/>
  <text x="660" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv_1</text>
  <text x="660" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">7×7×1280</text>
  
  <!-- Global Average Pooling -->
  <rect x="720" y="280" width="80" height="50" fill="url(#headGrad)" rx="5"/>
  <text x="760" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Global Avg</text>
  <text x="760" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Pool</text>
  <text x="760" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">1280</text>
  
  <!-- Detection Head -->
  <rect x="350" y="550" width="300" height="100" fill="none" stroke="#666" stroke-width="2" rx="10"/>
  <text x="500" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    Detection Head
  </text>
  
  <!-- Dense Layers -->
  <rect x="370" y="590" width="70" height="35" fill="url(#headGrad)" rx="5"/>
  <text x="405" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Dense</text>
  <text x="405" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">512</text>
  
  <rect x="460" y="590" width="70" height="35" fill="url(#headGrad)" rx="5"/>
  <text x="495" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Dense</text>
  <text x="495" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">256</text>
  
  <rect x="550" y="590" width="70" height="35" fill="url(#headGrad)" rx="5"/>
  <text x="585" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Dense</text>
  <text x="585" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">90</text>
  
  <!-- Output Reshape -->
  <rect x="450" y="680" width="100" height="40" fill="url(#outputGrad)" rx="5"/>
  <text x="500" y="698" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Detection Output</text>
  <text x="500" y="713" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">10×9 (10 objects)</text>
  
  <!-- Arrows -->
  <path d="M500,100 L500,120" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M500,160 L500,180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M500,220 L500,240" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M200,305 L220,305" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M300,305 L320,305" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M400,305 L420,305" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M500,305 L520,305" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M600,305 L620,305" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M700,305 L720,305" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M760,330 L500,550" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M440,607 L460,607" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M530,607 L550,607" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M500,650 L500,680" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Model Parameters Info -->
  <rect x="50" y="730" width="900" height="50" fill="#f8f9fa" stroke="#dee2e6" rx="5"/>
  <text x="500" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Model Statistics
  </text>
  <text x="250" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Total Parameters: 2.19M (8.38 MB)
  </text>
  <text x="500" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Trainable: 1.95M (7.43 MB)
  </text>
  <text x="750" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Non-trainable: 247K (965.75 KB)
  </text>
  
  <!-- Performance Metrics -->
  <rect x="750" y="400" width="200" height="120" fill="#e8f5e8" stroke="#4CAF50" stroke-width="2" rx="10"/>
  <text x="850" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
    Performance
  </text>
  <text x="770" y="445" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Train Coord Acc: 92.32%
  </text>
  <text x="770" y="460" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Val Coord Acc: 92.58%
  </text>
  <text x="770" y="475" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Train IoU: 0.291
  </text>
  <text x="770" y="490" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Val IoU: 0.240
  </text>
  <text x="770" y="505" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Target Reached ✓
  </text>
  
  <!-- Architecture Details -->
  <rect x="50" y="400" width="200" height="120" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="10"/>
  <text x="150" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
    Architecture
  </text>
  <text x="70" y="445" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • MobileNetV2 Backbone
  </text>
  <text x="70" y="460" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • 16 Inverted Residual Blocks
  </text>
  <text x="70" y="475" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Depthwise Separable Conv
  </text>
  <text x="70" y="490" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • 3-Layer Detection Head
  </text>
  <text x="70" y="505" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Multi-object Detection
  </text>
</svg>