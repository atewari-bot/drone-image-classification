version: '3.8'

services:
  drone-detection:
    build: .
    ports:
      - "5000:5000"  # Flask API
      - "8501:8501"  # Streamlit UI
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    environment:
      - PYTHONPATH=/app
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
